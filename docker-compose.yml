version: '3'

volumes:
  app_logs:

services:
  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      # 1. KRaft 核心設置
      - KAFKA_CFG_NODE_ID=1                                    # 節點ID，在集群中必須唯一
      - KAFKA_CFG_PROCESS_ROLES=controller,broker              # 該節點的角色：同時作為 controller 和 broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093       # controller 選舉配置，格式：nodeId@hostname:port

      # 2. Listeners 配置（監聽器設置）
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093   
      # 定義兩個監聽器：
      # - PLAINTEXT 監聽器在 9092 端口處理客戶端連接
      # - CONTROLLER 監聽器在 9093 端口處理控制器通信

      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      # 告訴客戶端如何連接到 Kafka
      # kafka:9092 是容器網絡中的地址

      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # 定義每個監聽器使用的安全協議：
      # - CONTROLLER 使用 PLAINTEXT（無安全認證）
      # - PLAINTEXT 使用 PLAINTEXT（無安全認證）

      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # 指定哪個監聽器用於 controller 通信

      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # 指定 broker 之間通信使用的監聽器

      # 3. Topic 配置
      - KAFKA_CREATE_TOPICS=logs:1:1
      # 自動創建名為 "logs" 的 topic
      # 格式：topic名稱:分區數:副本數

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.1
    volumes:
      - app_logs:/logs:ro
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      - kafka

  app:
    build: .
    volumes:
      - app_logs:/app/logs